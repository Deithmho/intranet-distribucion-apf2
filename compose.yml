services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: intranet
      POSTGRES_USER: ${DB_USERNAME:-intranet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecuta scripts/configurar-entorno.sh}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - apf2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d intranet"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  apf2_data:
