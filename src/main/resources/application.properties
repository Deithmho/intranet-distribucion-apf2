spring.application.name=intranet-distribucion-apf3
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/intranet}
spring.datasource.username=${DB_USERNAME:intranet}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:900000}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.email=${ADMIN_EMAIL:admin@example.test}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
server.error.include-message=never

app.refresh.expiration-seconds=${REFRESH_EXPIRATION:604800}
springdoc.swagger-ui.persist-authorization=false
server.forward-headers-strategy=framework
