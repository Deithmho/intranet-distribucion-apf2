name: intranet-apf3
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: intranet
      POSTGRES_USER: ${DB_USERNAME:-intranet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura .env}
    volumes:
      - apf3_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d intranet"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/intranet
      DB_USERNAME: ${DB_USERNAME:-intranet}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 900000
      BOOTSTRAP_ENABLED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: http://localhost:8083
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1024m
    cpus: 2.0
    restart: unless-stopped
volumes:
  apf3_data:
